[package]
name = "rdocx-word-engine"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdocx = { git = "https://github.com/0x00-Community/rdocx", rev = "32b728c57e5902ab4a4e943c17656e9f6b4fa181", default-features = false }
oxml-layout = { git = "https://github.com/0x00-Community/rdocx", rev = "32b728c57e5902ab4a4e943c17656e9f6b4fa181", default-features = false }
oxml-pdf = { git = "https://github.com/0x00-Community/rdocx", rev = "32b728c57e5902ab4a4e943c17656e9f6b4fa181" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rdocx = { git = "https://github.com/0x00-Community/rdocx", rev = "32b728c57e5902ab4a4e943c17656e9f6b4fa181", default-features = false }
oxml-pdf = { git = "https://github.com/0x00-Community/rdocx", rev = "32b728c57e5902ab4a4e943c17656e9f6b4fa181" }
png = "=0.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
