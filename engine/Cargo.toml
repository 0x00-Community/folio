[package]
name = "rdocx-word-engine"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdocx = { path = "../../rdocx-editing-kit/crates/rdocx", default-features = false }
oxml-layout = { path = "../../rdocx-editing-kit/crates/oxml-layout", default-features = false }
oxml-pdf = { path = "../../rdocx-editing-kit/crates/oxml-pdf" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rdocx = { path = "../../rdocx-editing-kit/crates/rdocx", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
