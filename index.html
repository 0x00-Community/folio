<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Word</title>
    <style>
      :root {
        --chrome-bg: #f7f7f8;
        --chrome-border: #dcdde1;
        --canvas-bg: #e9eaed;
        --text: #1f2328;
        --text-muted: #6b7280;
        --control-hover: rgba(0,0,0,.06);
        --control-active: rgba(0,0,0,.10);
        --accent: #2b6cdf;
        --accent-soft: rgba(43,108,223,.14);
        --field-bg: #ffffff;
        --error-bg: #fde8e8;
        --error-text: #6b1d1d;
        --page-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --chrome-bg: #26272b;
          --chrome-border: #3a3b40;
          --canvas-bg: #1b1c1f;
          --text: #e6e7ea;
          --text-muted: #9aa0aa;
          --control-hover: rgba(255,255,255,.08);
          --control-active: rgba(255,255,255,.14);
          --accent: #6ea0ff;
          --accent-soft: rgba(110,160,255,.22);
          --field-bg: #1f2023;
          --error-bg: #3a2224;
          --error-text: #ffb4b4;
        }
      }
      html, body { height: 100%; margin: 0 }
      #pages { height: 100% }
      body.shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        color: var(--text);
        background: var(--canvas-bg);
      }
      body.shell #pages {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }
      .toolbar, .status, .open-error {
        flex: none;
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .toolbar {
        /* acdert hit testing ignores the scroller clip, so content scrolled above the box covers this bar. */
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-height: 44px;
        padding: 0 8px;
        row-gap: 4px;
        color: var(--text);
        background: var(--chrome-bg);
        border-bottom: 1px solid var(--chrome-border);
      }
      .toolbar .group {
        display: flex;
        flex: none;
        align-items: center;
      }
      .toolbar .group.zoom { margin-left: auto }
      .toolbar .group > :not(.divider) + :not(.divider) { margin-left: 4px }
      .toolbar .divider {
        flex: none;
        width: 1px;
        height: 20px;
        margin: 0 8px;
        background: var(--chrome-border);
      }
      .toolbar button {
        box-sizing: border-box;
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 6px;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
      }
      .toolbar button.labeled {
        width: auto;
        padding: 0 8px 0 6px;
        gap: 6px;
      }
      .toolbar button svg,
      .toolbar button .glyph {
        display: block;
        width: 18px;
        height: 18px;
        flex: none;
      }
      .toolbar button svg { overflow: visible }
      .toolbar button .glyph {
        position: relative;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        line-height: 18px;
        text-align: center;
      }
      .toolbar button .glyph.bold { font-weight: 700 }
      .toolbar button .glyph.italic { font-style: italic }
      .toolbar button .glyph.underline::after,
      .toolbar button .glyph.strike::after {
        content: "";
        position: absolute;
        height: 1.6px;
        border-radius: 1px;
        background: currentColor;
      }
      .toolbar button .glyph.underline::after { left: 3px; right: 3px; bottom: 1px }
      .toolbar button .glyph.strike::after { left: 2px; right: 2px; top: 7.4px }
      .toolbar button:hover {
        background: var(--control-hover);
      }
      .toolbar button[aria-pressed="mixed"] {
        background: var(--control-hover);
      }
      .toolbar button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .toolbar button:active {
        background: var(--control-active);
      }
      .toolbar button:disabled {
        opacity: 0.4;
      }
      .toolbar button:disabled:hover,
      .toolbar button:disabled:active {
        background: transparent;
      }
      .toolbar button:focus,
      .toolbar select:focus {
        outline: none;
      }
      .toolbar button:focus-visible,
      .toolbar select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .toolbar select {
        box-sizing: border-box;
        flex: none;
        height: 28px;
        margin: 0;
        /* acdert draws its own chevron inside the content box even with appearance: none, so the page adds none. */
        padding: 0 4px 0 8px;
        border: 1px solid var(--chrome-border);
        border-radius: 6px;
        appearance: none;
        background-color: var(--field-bg);
        color: var(--text);
        font: inherit;
        line-height: 26px;
      }
      .toolbar select:hover {
        border-color: var(--text-muted);
      }
      .toolbar select.font { width: 12em }
      .toolbar select.size { width: 5em }
      .toolbar select.style { width: 9em }
      .toolbar select.zoom { width: 6em }
      .status {
        box-sizing: border-box;
        height: 26px;
        padding: 0 10px;
        overflow: hidden;
        font-size: 12px;
        line-height: 25px;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--text-muted);
        background: var(--chrome-bg);
        border-top: 1px solid var(--chrome-border);
      }
      .open-error {
        /* This band sits above the scroller, so the same clip-blind hit testing would cover it. */
        position: relative;
        z-index: 1;
        margin: 0;
        padding: 6px 10px;
        background: var(--error-bg);
        color: var(--error-text);
      }
      .unsaved {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--text) 35%, transparent);
      }
      .unsaved[hidden] { display: none }
      .unsaved-panel {
        box-sizing: border-box;
        width: min(440px, calc(100% - 32px));
        margin: 16px;
        padding: 16px 18px;
        color: var(--text);
        background: var(--chrome-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 8px;
        box-shadow: var(--page-shadow);
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .unsaved-panel p { margin: 0 0 14px }
      .unsaved-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .unsaved-actions button {
        height: 28px;
        padding: 0 12px;
        color: var(--text);
        background: var(--field-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .unsaved-actions button:hover { background: var(--control-hover) }
      .unsaved-actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .unsaved-actions button.primary {
        background: var(--accent-soft);
        border-color: var(--accent);
        font-weight: 600;
      }
      .unsaved-actions button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .page-setup,
      .insert-table {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 0 0 14px;
      }
      .page-setup-row,
      .insert-table-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .page-setup-margins {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
      }
      .page-setup input,
      .page-setup select,
      .insert-table input {
        box-sizing: border-box;
        width: 100%;
        height: 28px;
        padding: 0 8px;
        color: var(--text);
        background: var(--field-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 6px;
        font: inherit;
      }
      .page-setup input[aria-invalid="true"],
      .insert-table input[aria-invalid="true"] {
        border-color: var(--error-text);
      }
      .page-setup-orient {
        margin: 0;
        padding: 0;
        border: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
      .page-setup-orient legend {
        width: 100%;
        padding: 0;
        margin: 0;
        font-size: 12px;
        color: var(--text-muted);
      }
      .page-setup-orient label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar" class="toolbar" role="toolbar"></div>
    <p id="open-error" class="open-error" role="alert" hidden></p>
    <div id="pages"></div>
    <div id="status" class="status" role="status"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
